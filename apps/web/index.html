  <script>
    // Light by default; dark when the visitor turned it on (theme switch,
    // src/lib/theme.ts). Applied before first paint so nothing flashes.
    (function () {
      var dark = false;
      try { dark = localStorage.getItem("vendora-theme") === "dark"; } catch (e) {}
      var root = document.documentElement;
      if (dark) root.classList.add("dark");
      root.style.colorScheme = dark ? "dark" : "light";
    })();
  </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
