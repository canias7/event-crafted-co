  <script>
    // Apply theme before first paint to avoid the flash-of-light when
    // the user's preference is dark. Mirrors the logic in useTheme().
    (function () {
      try {
        var stored = localStorage.getItem("vendora-theme-preference");
        var sysDark = window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var resolved =
          stored === "light" ? "light"
          : stored === "dark" ? "dark"
          : sysDark ? "dark" : "light";
        if (resolved === "dark") {
          document.documentElement.classList.add("dark");
        }
        document.documentElement.style.colorScheme = resolved;
      } catch (e) { /* localStorage blocked — default to light */ }
    })();
  </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
