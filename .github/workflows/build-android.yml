name: Build Android (native)

# Native Android build pipeline. Replaces `eas build --platform android`.
# Runs on ubuntu-latest — FREE for public repos, very cheap for private
# (1x multiplier). Builds ~10-15 min.
#
# Flow:
#   1. Checkout + install deps
#   2. Run `npx expo prebuild --platform android` to generate android/
#      directory from app.json (CNG).
#   3. Decode keystore from secret + write gradle.properties.
#   4. ./gradlew bundleRelease → AAB.
#   5. Upload to Play Console internal track via Service Account.
#
# Required GitHub secrets:
#
#   ANDROID_KEYSTORE_BASE64       — base64-encoded .jks file
#                                   (download from EAS: `eas credentials`
#                                    → android → "Download keystore")
#   ANDROID_KEYSTORE_PASSWORD     — keystore password (EAS calls it "keystore password")
#   ANDROID_KEY_ALIAS             — typically "vendora" or whatever EAS named it
#   ANDROID_KEY_PASSWORD          — key password (same as keystore for EAS-generated)
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON — JSON service account from Google Cloud
#                                      that has Play Console publish permission
#                                      (Play Console → API access → service accounts)
#
# Already-shared with the existing mobile-build workflow:
#   SUPABASE_URL, SUPABASE_ANON_KEY

on:
  # Push a `trigger-build/**` branch to build + submit the VENDOR app
  # without the Actions UI (mirrors mobile-ota.yml's trigger-ota/**).
  # Push always builds vendor and submits to Play Internal. Host builds,
  # or a build-without-submit, use the "Run workflow" dispatch below.
  push:
    branches:
      - "trigger-build/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Which app?"
        type: choice
        options: [host, vendor]
        default: host
      submit:
        description: "Upload to Play Internal track after build?"
        type: boolean
        default: true

concurrency:
  group: build-android-${{ github.event.inputs.app || 'vendor' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android for ${{ inputs.app || 'vendor' }}-mobile
    runs-on: ubuntu-latest
    # A cold new-architecture Gradle build (compiles RN + Hermes C++ from
    # source) routinely runs ~40-55 min on a 2-core ubuntu runner. 40 min
    # cancelled it mid-`bundleRelease`; give it the same 60 the iOS build
    # gets. Gradle caching (below) trims subsequent runs.
    timeout-minutes: 60
    env:
      APP_DIR: apps/${{ inputs.app || 'vendor' }}-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          # NOTE: do NOT enable `cache: gradle` here — this is a CNG flow,
          # so there are no *.gradle files at checkout (android/ is created
          # later by `expo prebuild`). setup-java's cache then errors with
          # "No file ... matched", failing the job in ~15s.

      - name: Install JS deps
        run: bun install --frozen-lockfile --linker=hoisted

      # versionCode = epoch seconds. Monotonic + unique so Play never
      # rejects a duplicate (the workflow had no versionCode bump at all,
      # so every build shipped expo's default of 1). Set in app.json
      # BEFORE prebuild so it lands in build.gradle. Mirrors
      # build-ios.yml's buildNumber. Epoch (~1.78e9) is under Play's
      # 2.1e9 versionCode ceiling.
      - name: Set versionCode in app.json
        working-directory: ${{ env.APP_DIR }}
        run: |
          CODE=$(date +%s)
          echo "Using versionCode $CODE"
          CODE=$CODE node -e "const fs=require('fs');const p=require('./app.json');p.expo.android=p.expo.android||{};p.expo.android.versionCode=Number(process.env.CODE);fs.writeFileSync('./app.json',JSON.stringify(p,null,2));console.log('Set android.versionCode to',p.expo.android.versionCode);"

      - name: Expo prebuild (generate android/)
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # Per-app keystore — host and vendor have separate signing keys.
      - name: Decode + validate keystore
        working-directory: ${{ env.APP_DIR }}/android/app
        env:
          KEYSTORE_BASE64: ${{ inputs.app == 'host' && secrets.ANDROID_KEYSTORE_HOST_BASE64 || secrets.ANDROID_KEYSTORE_VENDOR_BASE64 }}
          KEYSTORE_PASSWORD: ${{ inputs.app == 'host' && secrets.ANDROID_KEYSTORE_HOST_PASSWORD || secrets.ANDROID_KEYSTORE_VENDOR_PASSWORD }}
        run: |
          # Strip any CR / LF / spaces the secret may carry (CRLF paste or
          # 76-column wrapping) before decoding — GNU base64 errors on a
          # stray \r and silently corrupts the output, which later surfaces
          # only at signReleaseBundle as the cryptic "Tag number over 30 is
          # not supported".
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release.keystore
          echo "Keystore size: $(wc -c < release.keystore) bytes"
          echo "First 4 bytes (feedfeed = JKS, 3082 = PKCS12):"
          head -c 4 release.keystore | xxd || true
          # Fail fast with an actionable message if the store can't be
          # opened, instead of burning 14 min of build first.
          if ! keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>keytool_err.txt; then
            echo "::error::release.keystore could not be opened. Re-check the ANDROID_KEYSTORE_VENDOR_BASE64 secret (must be clean base64 of the EAS keystore) and ANDROID_KEYSTORE_VENDOR_PASSWORD."
            cat keytool_err.txt || true
            exit 1
          fi
          echo "Keystore opened OK."

      # Inject signing config so ./gradlew bundleRelease produces a
      # signed AAB. Without these lines Gradle defaults to debug signing.
      - name: Configure gradle signing
        working-directory: ${{ env.APP_DIR }}/android
        env:
          KEYSTORE_PASSWORD: ${{ inputs.app == 'host' && secrets.ANDROID_KEYSTORE_HOST_PASSWORD || secrets.ANDROID_KEYSTORE_VENDOR_PASSWORD }}
          KEY_ALIAS:        ${{ inputs.app == 'host' && secrets.ANDROID_KEY_HOST_ALIAS        || secrets.ANDROID_KEY_VENDOR_ALIAS }}
          KEY_PASSWORD:     ${{ inputs.app == 'host' && secrets.ANDROID_KEY_HOST_PASSWORD     || secrets.ANDROID_KEY_VENDOR_PASSWORD }}
        run: |
          cat >> gradle.properties <<EOF

          # Injected by build-android.yml at CI time
          VENDORA_RELEASE_STORE_FILE=release.keystore
          VENDORA_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          VENDORA_RELEASE_KEY_ALIAS=$KEY_ALIAS
          VENDORA_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      # Patch app/build.gradle to use the injected signing config if it
      # doesn't already have one. Idempotent — bails if already present.
      # The node heredoc MUST sit at the run-block base indentation so the
      # closing 'JS' lands in column 0: bash does not recognize an indented
      # heredoc terminator, and the old (nested-in-`if`) version failed
      # with "here-document delimited by end-of-file / unexpected end of
      # file" before the build ever started.
      - name: Patch build.gradle with signing config
        working-directory: ${{ env.APP_DIR }}/android/app
        run: |
          if grep -q "VENDORA_RELEASE_STORE_FILE" build.gradle; then
            echo "build.gradle already has signing config; skipping"
            exit 0
          fi
          node <<'JS'
          const fs = require('fs');
          const path = 'build.gradle';
          let content = fs.readFileSync(path, 'utf8');
          const signingBlock = `
              signingConfigs {
                  release {
                      if (project.hasProperty('VENDORA_RELEASE_STORE_FILE')) {
                          storeFile file(VENDORA_RELEASE_STORE_FILE)
                          storePassword VENDORA_RELEASE_STORE_PASSWORD
                          keyAlias VENDORA_RELEASE_KEY_ALIAS
                          keyPassword VENDORA_RELEASE_KEY_PASSWORD
                      }
                  }
              }`;
          content = content.replace(/(\s+buildTypes\s*\{)/, signingBlock + '$1');
          content = content.replace(/signingConfig\s+signingConfigs\.debug/g, 'signingConfig signingConfigs.release');
          fs.writeFileSync(path, content);
          console.log('Patched build.gradle');
          JS

      # Build only the two ARM ABIs. x86 / x86_64 are emulator- and
      # Chromebook-only and roughly DOUBLE the native (RN + Hermes C++)
      # compile — which blew even the 60-min budget on a cold new-arch
      # build (run #11 timed out mid-`bundleRelease`). Appended last so it
      # overrides the 4-ABI default expo writes earlier in the file
      # (Java Properties: last key wins). arm64-v8a + armeabi-v7a cover
      # effectively every real Android phone.
      - name: Tune gradle.properties for CI (ABIs + JVM memory)
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          # Only the two ARM ABIs — x86/x86_64 are emulator/Chromebook-only
          # and ~double the native compile. Last key wins over expo's 4-ABI
          # default written earlier in the file.
          echo "reactNativeArchitectures=armeabi-v7a,arm64-v8a" >> gradle.properties
          # Raise Gradle JVM heap + Metaspace. expo's default caps Metaspace
          # at 512m, which OOM'd this large new-arch build
          # ("java.lang.OutOfMemoryError: Metaspace"), crashing the daemon
          # mid-bundleRelease and leaving the job to be cancelled. The runner
          # has ~16GB, so give Gradle real headroom. Last key wins.
          echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          echo "--- effective gradle.properties (CI overrides) ---"
          grep -nE "reactNativeArchitectures|org.gradle.jvmargs" gradle.properties || true

      - name: Build AAB
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Locate AAB
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          AAB=$(find app/build/outputs/bundle -name "*.aab" | head -1)
          echo "AAB_PATH=${{ env.APP_DIR }}/android/$AAB" >> $GITHUB_ENV
          echo "Found: $AAB"

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.app || 'vendor' }}-aab-${{ github.run_id }}
          path: ${{ env.AAB_PATH }}
          retention-days: 14

      - name: Upload to Google Play (Production track)
        if: ${{ inputs.submit || github.event_name == 'push' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.app == 'host' && 'co.eventcrafted.host' || 'com.eventvendora.forVendors' }}
          releaseFiles: ${{ env.AAB_PATH }}
          track: internal
          status: completed
