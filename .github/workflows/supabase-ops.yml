name: Supabase ops (one-shot)

# Applies the one-shot production changes listed in supabase/ops/ when they
# land on main: Auth config fields, migrations to run once, and retired edge
# functions to delete. Each step is idempotent. See supabase/ops/README.md.
#
# Runs only on push to main (never on pull requests), with the same
# SUPABASETOKEN secret the edge-function deploy uses.

on:
  push:
    branches: [main]
    paths:
      - "supabase/ops/**"
      - ".github/workflows/supabase-ops.yml"

permissions:
  contents: read

concurrency:
  group: supabase-ops
  cancel-in-progress: false

jobs:
  ops:
    name: Apply supabase/ops
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASETOKEN }}
      PROJECT_REF: pahpjjubhbcbwqjpamwv
      API: https://api.supabase.com/v1/projects/pahpjjubhbcbwqjpamwv
    steps:
      - uses: actions/checkout@v4

      - name: Check token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASETOKEN secret is not available to this workflow"
            exit 1
          fi

      - name: Auth config
        run: |
          set -euo pipefail
          code=$(curl -sS -o resp.json -w '%{http_code}' -X PATCH "$API/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @supabase/ops/auth-config.json)
          echo "PATCH /config/auth -> $code"
          if [ "$code" -ge 300 ]; then
            jq -c '{message, error}' resp.json 2>/dev/null || true
            exit 1
          fi
          # Echo back only the fields we set (the config also holds secrets).
          jq -c --argjson want "$(cat supabase/ops/auth-config.json)" \
            'with_entries(select(.key as $k | $want | has($k)))' resp.json
          rm -f resp.json

      - name: Optional auth hardening (may need a paid plan)
        continue-on-error: true
        run: |
          set -euo pipefail
          code=$(curl -sS -o resp.json -w '%{http_code}' -X PATCH "$API/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @supabase/ops/auth-config-optional.json)
          echo "PATCH /config/auth (optional) -> $code"
          if [ "$code" -ge 300 ]; then
            jq -c '{message, error}' resp.json 2>/dev/null || true
            rm -f resp.json
            exit 1
          fi
          jq -c --argjson want "$(cat supabase/ops/auth-config-optional.json)" \
            'with_entries(select(.key as $k | $want | has($k)))' resp.json
          rm -f resp.json

      - name: Apply migrations once
        run: |
          set -euo pipefail
          q() {
            # Runs SQL through the Management API; prints the JSON result.
            jq -n --arg query "$1" '{query: $query}' > body.json
            code=$(curl -sS -o out.json -w '%{http_code}' -X POST "$API/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" --data @body.json)
            if [ "$code" -ge 300 ]; then
              echo "::error::query failed ($code): $(jq -r '.message // .error // .' out.json | head -c 2000)"
              return 1
            fi
            cat out.json
          }
          grep -v '^\s*#' supabase/ops/apply-migrations.txt | sed '/^\s*$/d' | while read -r file; do
            path="supabase/migrations/$file"
            version="${file%%_*}"
            name="${file#*_}"; name="${name%.sql}"
            [ -f "$path" ] || { echo "::error::$path not found"; exit 1; }
            done=$(q "select count(*)::int as n from supabase_migrations.schema_migrations where version = '$version'" | jq -r '.[0].n')
            if [ "$done" != "0" ]; then
              echo "skip $file (already recorded)"
              continue
            fi
            echo "::group::apply $file"
            q "set lock_timeout = '15s'; $(cat "$path")" > /dev/null
            q "insert into supabase_migrations.schema_migrations (version, name) values ('$version', '$name') on conflict do nothing" > /dev/null
            echo "::endgroup::"
            echo "applied $file"
          done
          rm -f body.json out.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Delete retired edge functions
        run: |
          set -uo pipefail
          deployed=$(supabase functions list --project-ref "$PROJECT_REF" -o json | jq -r '.[].slug')
          fail=0
          while read -r fn; do
            if ! grep -qx "$fn" <<<"$deployed"; then
              echo "skip $fn (not deployed)"
              continue
            fi
            if supabase functions delete "$fn" --project-ref "$PROJECT_REF"; then
              echo "deleted $fn"
            else
              echo "::error::could not delete $fn"
              fail=1
            fi
          done < <(grep -v '^\s*#' supabase/ops/retired-functions.txt | sed '/^\s*$/d')
          exit $fail

      - name: Verify
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## Supabase ops"
            echo ""
            echo "Auth config now:"
            curl -sS "$API/config/auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              | jq -c --argjson want "$(jq -s add supabase/ops/auth-config.json supabase/ops/auth-config-optional.json)" 'with_entries(select(.key as $k | $want | has($k)))'
            echo ""
            echo "Retired functions still deployed:"
            left=$(supabase functions list --project-ref "$PROJECT_REF" -o json | jq -r '.[].slug' \
              | grep -xF -f <(grep -v '^\s*#' supabase/ops/retired-functions.txt | sed '/^\s*$/d') || true)
            echo "${left:-none}"
            echo ""
            echo "Webhook secrets configured (names only, values never read):"
            names=$(curl -sS "$API/secrets" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.[].name')
            for n in MUX_WEBHOOK_SECRET RESEND_WEBHOOK_SECRET STRIPE_WEBHOOK_SECRET; do
              if grep -qx "$n" <<<"$names"; then echo "- $n: set"; else echo "- $n: MISSING"; fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
