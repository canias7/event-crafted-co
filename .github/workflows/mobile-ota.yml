name: Mobile OTA Update

on:
  push:
    branches:
      - "trigger-ota/**"
  workflow_dispatch:
    inputs:
      apps:
        description: "Which app(s)?"
        type: choice
        options: [vendor, host, both]
        default: vendor
      message:
        description: "Update message"
        type: string
        default: "OTA update"

jobs:
  setup:
    name: Resolve OTA matrix
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.matrix.outputs.list }}
      message: ${{ steps.matrix.outputs.message }}
    steps:
      - id: matrix
        env:
          INPUT_APPS: ${{ inputs.apps }}
          INPUT_MSG: ${{ inputs.message }}
        run: |
          APPS_INPUT="${INPUT_APPS:-vendor}"
          MSG_INPUT="${INPUT_MSG:-OTA update from $GITHUB_REF_NAME}"
          case "$APPS_INPUT" in
            both)   echo 'list=["vendor-mobile","host-mobile"]' >> "$GITHUB_OUTPUT" ;;
            host)   echo 'list=["host-mobile"]' >> "$GITHUB_OUTPUT" ;;
            vendor|*) echo 'list=["vendor-mobile"]' >> "$GITHUB_OUTPUT" ;;
          esac
          echo "message=$MSG_INPUT" >> "$GITHUB_OUTPUT"

  ota:
    name: OTA ${{ matrix.app }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: npm ci
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee /tmp/install.log
          exit ${PIPESTATUS[0]}

      - name: eas update
        working-directory: apps/${{ matrix.app }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          {
            echo "=== eas whoami ==="
            eas whoami
            echo "=== eas --version ==="
            eas --version
            echo "=== eas update ==="
            eas update --non-interactive --branch production --message "${{ needs.setup.outputs.message }}"
            echo "=== eas update:list (latest 5 on production) ==="
            eas update:list --branch production --limit 5 --json --non-interactive | head -200
          } 2>&1 | tee /tmp/update.log

      - name: Publish run summary
        if: always()
        run: |
          {
            echo "## OTA run summary"
            echo ""
            echo "### npm ci tail"
            echo '```'
            tail -60 /tmp/install.log 2>/dev/null || echo "(no install log)"
            echo '```'
            echo ""
            echo "### eas update output"
            echo '```'
            cat /tmp/update.log 2>/dev/null || echo "(no update log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
