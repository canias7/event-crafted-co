name: Mobile OTA Update

on:
  push:
    branches:
      - "trigger-ota/**"
  workflow_dispatch:
    inputs:
      apps:
        description: "Which app(s)?"
        type: choice
        options: [vendor, host, both]
        default: vendor
      message:
        description: "Update message"
        type: string
        default: "OTA update"

permissions:
  contents: write

jobs:
  setup:
    name: Resolve OTA matrix
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.matrix.outputs.list }}
      message: ${{ steps.matrix.outputs.message }}
    steps:
      - id: matrix
        env:
          INPUT_APPS: ${{ inputs.apps }}
          INPUT_MSG: ${{ inputs.message }}
        run: |
          APPS_INPUT="${INPUT_APPS:-vendor}"
          MSG_INPUT="${INPUT_MSG:-OTA update from $GITHUB_REF_NAME}"
          case "$APPS_INPUT" in
            both)   echo 'list=["vendor-mobile","host-mobile"]' >> "$GITHUB_OUTPUT" ;;
            host)   echo 'list=["host-mobile"]' >> "$GITHUB_OUTPUT" ;;
            vendor|*) echo 'list=["vendor-mobile"]' >> "$GITHUB_OUTPUT" ;;
          esac
          echo "message=$MSG_INPUT" >> "$GITHUB_OUTPUT"

  ota:
    name: OTA ${{ matrix.app }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: npm ci
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/install.log
          echo "NPM_CI_EXIT=${PIPESTATUS[0]}" >> /tmp/install.log

      - name: eas update
        working-directory: apps/${{ matrix.app }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set +e
          {
            echo "=== eas whoami ==="
            eas whoami
            echo "WHOAMI_EXIT=$?"
            echo "=== eas --version ==="
            eas --version
            echo "=== eas update ==="
            eas update --non-interactive --branch production --message "${{ needs.setup.outputs.message }}"
            echo "UPDATE_EXIT=$?"
            echo "=== eas update:list (latest 5 on production) ==="
            eas update:list --branch production --limit 5 --json --non-interactive | head -200 || echo "LIST_FAILED"
          } 2>&1 | tee /tmp/update.log

      - name: Always commit logs to repo for inspection
        if: always()
        run: |
          set +e
          mkdir -p .ci-logs
          {
            echo "# OTA run ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo ""
            echo "## npm ci tail"
            echo '```'
            tail -100 /tmp/install.log 2>/dev/null || echo "(no install log)"
            echo '```'
            echo ""
            echo "## eas update output"
            echo '```'
            cat /tmp/update.log 2>/dev/null || echo "(no update log)"
            echo '```'
          } > .ci-logs/last-${{ matrix.app }}.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin trigger-ota/listing-builder || true
          git stash --include-untracked || true
          git checkout trigger-ota/listing-builder
          git stash pop || true
          git add -f .ci-logs/last-${{ matrix.app }}.md
          git commit -m "chore(ci): log OTA run ${{ github.run_id }} [skip ci]" || echo "NOTHING_TO_COMMIT"
          for i in 1 2 3; do git push origin trigger-ota/listing-builder && break; sleep 2; done
