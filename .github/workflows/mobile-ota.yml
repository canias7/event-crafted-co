name: Mobile OTA Update

on:
  push:
    branches:
      - "trigger-ota/**"
  workflow_dispatch:
    inputs:
      apps:
        description: "Which app(s)?"
        type: choice
        options: [vendor, host, both]
        default: vendor
      message:
        description: "Update message"
        type: string
        default: "OTA update"

jobs:
  setup:
    name: Resolve OTA matrix
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.matrix.outputs.list }}
      message: ${{ steps.matrix.outputs.message }}
    steps:
      - id: matrix
        env:
          INPUT_APPS: ${{ inputs.apps }}
          INPUT_MSG: ${{ inputs.message }}
        run: |
          APPS_INPUT="${INPUT_APPS:-vendor}"
          MSG_INPUT="${INPUT_MSG:-OTA update from $GITHUB_REF_NAME}"
          case "$APPS_INPUT" in
            both)   echo 'list=["vendor-mobile","host-mobile"]' >> "$GITHUB_OUTPUT" ;;
            host)   echo 'list=["host-mobile"]' >> "$GITHUB_OUTPUT" ;;
            vendor|*) echo 'list=["vendor-mobile"]' >> "$GITHUB_OUTPUT" ;;
          esac
          echo "message=$MSG_INPUT" >> "$GITHUB_OUTPUT"

  ota:
    name: OTA ${{ matrix.app }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Diagnose and report
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Mobile OTA secret diagnostic"
            echo ""
            echo "### Secret presence"
            if [ -z "$EXPO_TOKEN" ]; then echo "- EXPO_TOKEN: **EMPTY** (the secret is not set, or stored in an environment this job has no access to)"; else echo "- EXPO_TOKEN: SET (len=${#EXPO_TOKEN}, prefix=${EXPO_TOKEN:0:4})"; fi
            if [ -z "$EAS_TOKEN" ]; then echo "- EAS_TOKEN: empty"; else echo "- EAS_TOKEN: SET (len=${#EAS_TOKEN}, prefix=${EAS_TOKEN:0:4})"; fi
            if [ -z "$EXPO_ACCESS_TOKEN" ]; then echo "- EXPO_ACCESS_TOKEN: empty"; else echo "- EXPO_ACCESS_TOKEN: SET (len=${#EXPO_ACCESS_TOKEN}, prefix=${EXPO_ACCESS_TOKEN:0:4})"; fi
            echo ""
            echo "### eas whoami output"
            echo ""
            echo '```'
            EXPO_TOKEN="$EXPO_TOKEN" eas whoami 2>&1 || true
            echo '```'
          } > /tmp/diag.md
          cat /tmp/diag.md
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "OTA diagnostic: secret presence check" \
            --body-file /tmp/diag.md \
            --label "diagnostic" || gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "OTA diagnostic: secret presence check" \
            --body-file /tmp/diag.md

      - name: eas update
        working-directory: apps/${{ matrix.app }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          eas update \
            --non-interactive \
            --branch production \
            --clear-cache \
            --message "${{ needs.setup.outputs.message }}"
