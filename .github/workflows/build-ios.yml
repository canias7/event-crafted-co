name: Build iOS (native)

# Native iOS build pipeline. Replaces `eas build --platform ios`.
# Runs on GitHub Actions macos-latest runners — FREE for public repos,
# $0.16/min for private. Builds ~20-30 min.
#
# Flow:
#   1. Checkout + install deps
#   2. Run `npx expo prebuild --platform ios` to generate the ios/
#      directory from app.json (Expo's CNG / continuous native generation).
#   3. Install CocoaPods.
#   4. Import Apple Developer cert from secrets into the runner keychain.
#   5. Install provisioning profile.
#   6. `xcodebuild archive` → .xcarchive
#   7. `xcodebuild -exportArchive` → .ipa
#   8. Upload to TestFlight via App Store Connect API.
#
# Required GitHub secrets (configure once at
# github.com/canias7/event-crafted-co/settings/secrets/actions):
#
#   IOS_CERT_P12_BASE64         — base64-encoded .p12 cert export
#                                 (export from Mac Keychain → Login →
#                                  your Developer cert → right-click →
#                                  Export → .p12 with password → then
#                                  `base64 -i cert.p12 | pbcopy`)
#   IOS_CERT_PASSWORD           — password used when exporting the .p12
#   IOS_PROVISIONING_PROFILE_BASE64 — base64-encoded .mobileprovision
#                                     (download from developer.apple.com)
#   IOS_KEYCHAIN_PASSWORD       — any random string; runner-local keychain pass
#   ASC_API_KEY_ID              — App Store Connect API key ID (10 chars)
#   ASC_API_KEY_ISSUER_ID       — App Store Connect issuer UUID
#   ASC_API_KEY_BASE64          — base64-encoded .p8 private key
#                                 (from appstoreconnect.apple.com →
#                                  Users and Access → Integrations → Team Keys)
#
# Already-shared with the existing mobile-build workflow:
#   SUPABASE_URL, SUPABASE_ANON_KEY

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app?"
        type: choice
        options: [host, vendor]
        default: host
      submit:
        description: "Upload to TestFlight after build?"
        type: boolean
        default: true

# Cancel any older in-flight run when a new one starts.
concurrency:
  group: build-ios-${{ github.event.inputs.app }}
  cancel-in-progress: false

jobs:
  build:
    name: Build iOS for ${{ inputs.app }}-mobile
    # macos-26 ships with Xcode 26.x (Swift 6.0+). macos-latest currently
    # points to macos-15 with Xcode 16.4 (Swift 5.10), which can't compile
    # expo-modules-core's Swift 6 syntax (e.g. @MainActor in extension
    # conformance clauses). Match EAS's "macos-sequoia-15.6-xcode-26.2".
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_DIR: apps/${{ inputs.app }}-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm Xcode version
        run: |
          echo "Default Xcode: $(xcode-select -p)"
          xcodebuild -version
          swift --version

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --linker=hoisted: Metro's babel plugin can't resolve preset-expo
      # through Bun's default isolated symlink layout. Same workaround as
      # mobile-ota.yml uses.
      - name: Install JS deps
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      # Mirrors EAS's `autoIncrement: true`: query App Store Connect
      # for the max build number under the current app version and add
      # 1. Without this the build number resets to 1 on each fresh
      # pipeline, and TestFlight sorts builds by number descending —
      # so the previous EAS build (#27 / #41) keeps showing as
      # "latest" even though our build is newer chronologically.
      - name: Compute next build number
        env:
          ASC_API_KEY_ID:          ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID:   ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_BASE64:      ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_APP_ID:              ${{ inputs.app == 'host' && '6767471797' || '6767470298' }}
        run: |
          # Decode the .p8 key once for this step.
          mkdir -p ~/private_keys
          P8="$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          echo -n "$ASC_API_KEY_BASE64" | base64 --decode > "$P8"
          # Use Python (preinstalled) + pip-install pyjwt to mint a JWT.
          # --break-system-packages: macOS-26 runner has PEP 668
          # externally-managed Python; bypass is safe for an ephemeral
          # CI runner.
          pip3 install --quiet --break-system-packages pyjwt cryptography
          NEXT=$(python3 <<'PY'
          import os, time, json, urllib.request, jwt
          from pathlib import Path
          kid    = os.environ["ASC_API_KEY_ID"]
          issuer = os.environ["ASC_API_KEY_ISSUER_ID"]
          app_id = os.environ["ASC_APP_ID"]
          pk = Path(os.path.expanduser(f"~/private_keys/AuthKey_{kid}.p8")).read_text()
          now = int(time.time())
          tok = jwt.encode(
              {"iss": issuer, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
              pk, algorithm="ES256", headers={"kid": kid, "typ": "JWT"},
          )
          req = urllib.request.Request(
              f"https://api.appstoreconnect.apple.com/v1/builds?filter[app]={app_id}&sort=-version&limit=10",
              headers={"Authorization": f"Bearer {tok}"},
          )
          data = json.loads(urllib.request.urlopen(req).read())
          nums = []
          for b in data.get("data", []):
              try:
                  nums.append(int(b["attributes"]["version"]))
              except (TypeError, ValueError):
                  pass
          print(max(nums) + 1 if nums else 1)
          PY
          )
          echo "Next build number: $NEXT"
          echo "BUILD_NUMBER=$NEXT" >> $GITHUB_ENV

      # Inject the computed build number into app.json BEFORE prebuild
      # so it ends up in Info.plist as CFBundleVersion. Passing
      # CURRENT_PROJECT_VERSION to xcodebuild later doesn't update the
      # embedded plist — Apple rejects "bundle version must be higher
      # than 27" otherwise.
      - name: Set buildNumber in app.json
        working-directory: ${{ env.APP_DIR }}
        run: |
          node -e "
            const fs = require('fs');
            const p = require('./app.json');
            p.expo.ios = p.expo.ios || {};
            p.expo.ios.buildNumber = process.env.BUILD_NUMBER;
            fs.writeFileSync('./app.json', JSON.stringify(p, null, 2));
            console.log('Set ios.buildNumber to', p.expo.ios.buildNumber);
          "

      # CNG: Expo regenerates the native ios/ project from app.json
      # every build. Don't commit the generated ios/ directory — it's
      # ephemeral. --clean nukes any stale generated files first.
      - name: Expo prebuild (generate ios/)
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx expo prebuild --platform ios --clean --no-install
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Install CocoaPods
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          gem install cocoapods --no-document
          pod install --repo-update

      # Imports cert into a runner-only keychain. Auto-cleans on job
      # finish. Cleaner than doing it ourselves via `security` commands.
      - name: Import Apple Developer cert
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERT_PASSWORD }}
          keychain-password: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}

      # Per-app provisioning profile — host and vendor have different
      # bundle IDs so each gets its own profile. Cert is shared.
      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ inputs.app == 'host' && secrets.IOS_PROVISIONING_PROFILE_HOST_BASE64 || secrets.IOS_PROVISIONING_PROFILE_VENDOR_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$PROFILE_BASE64" \
            | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          # Extract UUID so xcodebuild can find it by reference if needed
          uuid=$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision \
            | plutil -extract UUID raw -)
          echo "PROVISIONING_PROFILE_UUID=$uuid" >> $GITHUB_ENV
          echo "Profile UUID: $uuid"

      # ExportOptions.plist tells xcodebuild how to package the .ipa.
      # method=app-store → produces a TestFlight-ready binary.
      - name: Write ExportOptions.plist
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          # Find the bundle id from app.json
          BUNDLE_ID=$(node -e "console.log(require('../app.json').expo.ios.bundleIdentifier)")
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>MY8LTVJQ82</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROVISIONING_PROFILE_UUID</string>
            </dict>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          cat ExportOptions.plist

      - name: Discover workspace + scheme
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          # `ls *.xcworkspace` lists the CONTENTS of the bundle dir.
          # Use `ls -d` to get the directory name itself.
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          # The app's scheme matches the .xcworkspace name (e.g.
          # `Vendora.xcworkspace` → `Vendora`). Picking the first
          # scheme alphabetically returned `EASClient` (an Expo pod
          # helper, not the app target) which fails to archive.
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "WORKSPACE=$WORKSPACE" >> $GITHUB_ENV
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"
          echo "--- available schemes (for reference) ---"
          xcodebuild -workspace "$WORKSPACE" -list 2>&1 | head -40

      - name: Archive
        working-directory: ${{ env.APP_DIR }}/ios
        env:
          # CRITICAL: The JS bundle is generated DURING `xcodebuild
          # archive` (via the "Bundle React Native code and images"
          # build phase, which spawns Metro). EXPO_PUBLIC_* env vars
          # get inlined into the bundle at THIS step. Setting them
          # only on `expo prebuild` (which just generates the native
          # project) is too early — the bundle gets undefined values
          # and Supabase client crashes on init.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # xcpretty is no longer preinstalled on macos-latest. Without
          # it, the raw xcodebuild output goes straight through — uglier
          # but you can actually see compile errors.
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/app.xcarchive \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=MY8LTVJQ82 \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Export .ipa
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          set -o pipefail
          # Capture distribution logs path so we can dump them if export fails
          if ! xcodebuild \
                -exportArchive \
                -archivePath build/app.xcarchive \
                -exportPath build/ipa \
                -exportOptionsPlist ExportOptions.plist; then
            echo "::group::xcdistributionlogs"
            # The actual error message lives in these logs
            find /var/folders -name "*.xcdistributionlogs" -type d 2>/dev/null \
              | head -1 \
              | xargs -I {} find {} -type f \
              | head -20 \
              | xargs -I {} sh -c 'echo "=== {} ==="; cat "{}"' || true
            echo "::endgroup::"
            exit 1
          fi
          ls -la build/ipa/

      - name: Upload .ipa as workflow artifact (audit trail)
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.app }}-ipa-${{ github.run_id }}
          path: ${{ env.APP_DIR }}/ios/build/ipa/*.ipa
          retention-days: 14

      - name: Decode App Store Connect API key
        if: ${{ inputs.submit }}
        run: |
          mkdir -p ~/private_keys
          echo -n "${{ secrets.ASC_API_KEY_BASE64 }}" \
            | base64 --decode \
            > ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8

      - name: Upload to TestFlight
        if: ${{ inputs.submit }}
        working-directory: ${{ env.APP_DIR }}/ios/build/ipa
        run: |
          IPA=$(ls *.ipa | head -1)
          xcrun altool --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "${{ secrets.ASC_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_API_KEY_ISSUER_ID }}"
