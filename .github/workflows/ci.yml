name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  typecheck-build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      # typecheck:all covers web + admin + vendor-mobile + host-mobile.
      # We were only running `npm run typecheck` (web only) which let
      # admin and mobile typecheck errors slip past CI for weeks.
      - run: bun run typecheck:all
      - run: bun run build
        env:
          # Build needs the Vite env vars but their values can be the placeholders;
          # the check is that the bundle compiles, not that it talks to Supabase.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder

  e2e:
    name: Smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run test:e2e
        env:
          # Public + gated smoke tests run against placeholders. When the
          # operator sets the E2E_* secrets (a throwaway approved-vendor
          # account + the real project URL/anon key), the app and the
          # auth.setup sign-in both target the real backend so the
          # authenticated vendor-display tests activate. Without the
          # secrets these fall back to placeholders and those tests skip.
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || 'placeholder' }}
          VITE_SUPABASE_PROJECT_ID: placeholder
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_VENDOR_EMAIL: ${{ secrets.E2E_VENDOR_EMAIL }}
          E2E_VENDOR_PASSWORD: ${{ secrets.E2E_VENDOR_PASSWORD }}
