name: Mobile EAS Diagnostic

# One-shot: dumps EAS state (channel mappings, recent updates,
# build history) for both apps to a Supabase log sink so we can
# debug why OTAs aren't applying.
#
# Trigger: push trigger-diag/<anything>

on:
  push:
    branches:
      - "trigger-diag/**"
  workflow_dispatch:

jobs:
  diag:
    name: Diag ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ["vendor-mobile", "host-mobile"]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: bun install --frozen-lockfile --linker=hoisted

      - name: Gather EAS state and post to log sink
        working-directory: apps/${{ matrix.app }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: |
          APP="${{ matrix.app }}"
          SINK="https://pahpjjubhbcbwqjpamwv.supabase.co/functions/v1/mobile-debug-log"

          post_raw() {
            local kind="$1"
            local raw="$2"
            # Embed as a string so jq parsing doesn't drop it.
            curl -s -X POST "$SINK" \
              -H "content-type: application/json" \
              -d "$(jq -n --arg app "$APP" --arg kind "$kind" --arg raw "$raw" '{app:$app,kind:$kind,raw:$raw}')" \
              --max-time 10 || true
          }

          echo "==> channel:view production"
          CHAN_RAW=$(eas channel:view production --non-interactive 2>&1 || true)
          echo "$CHAN_RAW"
          post_raw "channel-view-raw" "$CHAN_RAW"

          echo "==> channel:list"
          CHAN_LIST=$(eas channel:list --non-interactive 2>&1 || true)
          echo "$CHAN_LIST"
          post_raw "channel-list-raw" "$CHAN_LIST"

          echo "==> branch:list"
          BRANCHES=$(eas branch:list --non-interactive 2>&1 || true)
          echo "$BRANCHES"
          post_raw "branch-list-raw" "$BRANCHES"

          echo "==> build:list (last 3)"
          BUILDS=$(eas build:list --non-interactive --limit 3 2>&1 || true)
          echo "$BUILDS"
          post_raw "build-list-raw" "$BUILDS"

          echo "Done."
