name: Mobile OTA Rollback

# Repoints the `production` channel for both apps to an empty EAS
# branch, effectively making the EAS server return "no update
# available" to all installed builds. Use this when bad OTAs are
# crashing installs (iOS 26 expo-updates bug, etc.) and we need to
# stop serving them without disabling expo-updates in the app.
#
# To re-enable OTAs later: run `eas channel:edit production --branch
# production` (or push trigger-ota/* to publish a fresh OTA, which
# auto-creates the branch mapping).
#
# Trigger: push any branch starting with `trigger-rollback/`.

on:
  push:
    branches:
      - "trigger-rollback/**"
  workflow_dispatch:

jobs:
  rollback:
    name: Rollback ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ["vendor-mobile", "host-mobile"]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: bun install --frozen-lockfile --linker=hoisted

      - name: Point production channel at an empty rollback branch
        working-directory: apps/${{ matrix.app }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: |
          # Create the empty rollback branch (idempotent — ignore "already exists").
          echo "Creating rollback-stop branch (or noop if exists)..."
          eas branch:create rollback-stop --non-interactive || echo "(already exists)"

          # Point the production channel at the empty branch.
          # App checks production channel -> resolves to rollback-stop branch
          # -> no updates on it -> app uses embedded bundle.
          echo "Pointing production channel at rollback-stop..."
          eas channel:edit production --branch rollback-stop --non-interactive
