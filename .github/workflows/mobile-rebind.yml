name: Mobile OTA Channel Rebind

# Re-bind the production channel for both apps back to the
# production branch. Use this when the rollback workflow (which
# points the channel at rollback-stop) was run and we now want
# installed apps to start receiving updates from the production
# branch again.
#
# Trigger: push a branch named trigger-rebind/<anything>.

on:
  push:
    branches:
      - "trigger-rebind/**"
  workflow_dispatch:

jobs:
  rebind:
    name: Rebind ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ["vendor-mobile", "host-mobile"]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: bun install --frozen-lockfile --linker=hoisted

      - name: Point production channel back at production branch
        working-directory: apps/${{ matrix.app }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: |
          echo "Listing current channel mapping..."
          eas channel:view production --non-interactive --json || true

          echo "Pointing production channel at production branch..."
          eas channel:edit production --branch production --non-interactive

          echo "Verifying..."
          eas channel:view production --non-interactive --json || true
