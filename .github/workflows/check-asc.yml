name: Check App Store Connect access

# Throwaway diagnostic (branch check-asc/**): asks the App Store Connect API,
# with the same key the iOS build uses, whether it can see each app. Prints
# only HTTP status codes and Apple's error codes/titles, never key material.

on:
  push:
    branches: ["check-asc/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query App Store Connect
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          set -u
          for v in ASC_API_KEY_ID ASC_API_KEY_ISSUER_ID ASC_API_KEY_BASE64; do
            if [ -z "${!v}" ]; then echo "$v: MISSING"; else echo "$v: set (${#v} name chars)"; fi
          done
          pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, urllib.error
          import jwt
          try:
              key = base64.b64decode(os.environ["ASC_API_KEY_BASE64"]).decode()
          except Exception as e:
              print("ASC_API_KEY_BASE64 does not decode as base64 text:", type(e).__name__); raise SystemExit(1)
          print("p8 looks like a private key:", "BEGIN PRIVATE KEY" in key)
          tok = jwt.encode(
              {"iss": os.environ["ASC_API_KEY_ISSUER_ID"].strip(), "iat": int(time.time()),
               "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256",
              headers={"kid": os.environ["ASC_API_KEY_ID"].strip(), "typ": "JWT"})
          def get(url):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + tok})
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  try: body = json.load(e)
                  except Exception: body = {}
                  return e.code, body
          def errors(body):
              return [(x.get("status"), x.get("code"), x.get("title"), x.get("detail")) for x in body.get("errors", [])]
          s, b = get("https://api.appstoreconnect.apple.com/v1/apps?limit=50&fields[apps]=bundleId,name")
          print("\nGET /v1/apps ->", s)
          if s == 200:
              apps = [(a["attributes"].get("bundleId"), a["attributes"].get("name")) for a in b.get("data", [])]
              print("apps this key can see:", apps)
          else:
              print("errors:", errors(b))
          for bid in ["co.eventcrafted.vendor", "co.eventcrafted.host"]:
              s, b = get("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=" + bid)
              found = len(b.get("data", [])) if s == 200 else None
              print(f"\n{bid}: HTTP {s}, apps found: {found}", "" if s == 200 else errors(b))
          PY
