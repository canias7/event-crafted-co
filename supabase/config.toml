project_id = "pahpjjubhbcbwqjpamwv"

[functions]
  [functions.auth-email-hook]
    verify_jwt = false
  # Admin login: PIN-gated, mints the admin session server-side (bypasses
  # project captcha). The caller has no JWT yet — must be false.
  [functions.admin-session]
    verify_jwt = false
  [functions.contract-send-otp]
    verify_jwt = false
  [functions.proposal-accepted-email]
    verify_jwt = false
  # Fired by the notifications push fan-out trigger with no JWT — must be
  # false or the gateway 401s every push before the handler runs.
  [functions.send-push]
    verify_jwt = false
  [functions.cleanup-portfolio-orphans]
    verify_jwt = false
  [functions.geocode-vendor]
    verify_jwt = true
  [functions.stripe-billing-info]
    verify_jwt = true
  [functions.stripe-change-tier]
    verify_jwt = true
  [functions.stripe-customer-portal]
    verify_jwt = true
  [functions.stripe-subscription-checkout]
    verify_jwt = true
  [functions.stripe-sync-subscription]
    verify_jwt = true
  [functions.stripe-topup-checkout]
    verify_jwt = true
  [functions.stripe-webhook]
    verify_jwt = false
  # External webhooks: the caller (Stripe/Resend/Mux) authenticates via
  # its own signed-payload header, not a Supabase JWT. They MUST run
  # with verify_jwt = false or the gateway 401s the request before the
  # handler's signature check ever runs. Without an entry here the CLI
  # defaults verify_jwt to true — which silently broke payment, email,
  # and live-stream event reconciliation.
  [functions.vendorapay-webhook]
    verify_jwt = false
  [functions.resend-webhook]
    verify_jwt = false
  [functions.mux-webhook]
    verify_jwt = false
  # Internal service-role callees: invoked function-to-function with
  # Authorization: Bearer <service-role>. The project's service-role key
  # is the new sb_secret_ format (not a JWT), so the gateway's verify_jwt
  # 401s the Bearer before the function runs. Both functions already
  # self-authenticate (they reject any caller not presenting the exact
  # service-role secret / a valid user JWT), so verify_jwt = false is
  # safe and restores receipt + invoice email sending.
  [functions.vendorapay-notify]
    verify_jwt = false
  [functions.vendorapay-invoice-send]
    verify_jwt = false
  [functions.vendorapay-document-send]
    verify_jwt = false
  [functions.process-email-queue]
    verify_jwt = true
  [functions.scan-daily-digests]
    verify_jwt = false
  [functions.scan-expired-inquiries]
    verify_jwt = false
  [functions.scan-responder-tiers]
    verify_jwt = false
  [functions.scan-review-prompts]
    verify_jwt = false
  [functions.scan-saved-search-matches]
    verify_jwt = false
  [functions.scan-vendor-onboarding-nudges]
    verify_jwt = false
  [functions.scan-vendor-weekly-digests]
    verify_jwt = false
  [functions.send-transactional-email]
    verify_jwt = true
  [functions.signin-2fa]
    verify_jwt = false
  [functions.sitemap-xml]
    verify_jwt = false
  [functions.vendor-signup]
    verify_jwt = false
